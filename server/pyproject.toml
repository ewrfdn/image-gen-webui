[project]
name = "image-gen-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5",
  "sqlalchemy>=2.0.41,<2.1", "asyncpg>=0.30,<1", "httpx==0.28.1",
  "python-multipart>=0.0.20,<1", "cryptography>=44,<48", "pillow==12.3.0",
  "jsonschema>=4.23,<5",
]
[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
