  "components": {
    "schemas": {
      "AppliedLora": {
        "properties": {
          "lora_id": {
            "type": "string",
            "title": "Lora Id"
          },
          "scale": {
            "type": "number",
            "title": "Scale"
          },
          "sha256": {
            "type": "string",
            "title": "Sha256"
          }
        },
        "type": "object",
        "required": [
          "lora_id",
          "scale",
          "sha256"
        ],
        "title": "AppliedLora"
      },
      "GenerationData": {
        "properties": {
          "b64_json": {
            "type": "string",
            "title": "B64 Json"
          }
        },
        "type": "object",
        "required": [
          "b64_json"
        ],
        "title": "GenerationData"
      },
      "GenerationMetadata": {
        "properties": {
          "request_id": {
            "type": "string",
            "title": "Request Id"
          },
          "model_revision": {
            "type": "string",
            "title": "Model Revision"
          },
          "seed": {
            "type": "integer",
            "title": "Seed"
          },
          "loras": {
            "items": {
              "$ref": "#/components/schemas/AppliedLora"
            },
            "type": "array",
            "title": "Loras"
          },
          "inference_ms": {
            "type": "integer",
            "title": "Inference Ms"
          }
        },
        "type": "object",
        "required": [
          "request_id",
          "model_revision",
          "seed",
          "loras",
          "inference_ms"
        ],
        "title": "GenerationMetadata"
      },
      "GenerationRequest": {
        "properties": {
          "model": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Model"
          },
          "prompt": {
            "type": "string",
            "maxLength": 4000,
            "minLength": 1,
            "title": "Prompt"
          },
          "size": {
            "type": "string",
            "title": "Size",
            "default": "1024x1024"
          },
          "n": {
            "type": "integer",
            "const": 1,
            "title": "N",
            "default": 1
          },
          "response_format": {
            "type": "string",
            "const": "b64_json",
            "title": "Response Format",
            "default": "b64_json"
          },
          "seed": {
            "anyOf": [
              {
                "type": "integer",
                "maximum": 4294967295.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Seed"
          },
          "num_inference_steps": {
            "anyOf": [
              {
                "type": "integer",
                "maximum": 100.0,
                "minimum": 1.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Num Inference Steps"
          },
          "guidance_scale": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 20.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Guidance Scale"
          },
          "negative_prompt": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 4000
              },
              {
                "type": "null"
              }
            ],
            "title": "Negative Prompt"
          },
          "loras": {
            "items": {
              "$ref": "#/components/schemas/LoraSelection"
            },
            "type": "array",
            "maxItems": 1,
            "title": "Loras"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "model",
          "prompt"
        ],
        "title": "GenerationRequest"
      },
      "GenerationResponse": {
        "properties": {
          "created": {
            "type": "integer",
            "title": "Created"
          },
          "data": {
            "items": {
              "$ref": "#/components/schemas/GenerationData"
            },
            "type": "array",
            "title": "Data"
          },
          "metadata": {
            "$ref": "#/components/schemas/GenerationMetadata"
          }
        },
        "type": "object",
        "required": [
          "created",
          "data",
          "metadata"
        ],
        "title": "GenerationResponse"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "LifecycleResponse": {
        "properties": {
          "model_id": {
            "type": "string",
            "title": "Model Id"
          },
          "state": {
            "type": "string",
            "enum": [
              "ready",
              "unloaded"
            ],
            "title": "State"
          },
          "revision": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Revision"
          }
        },
        "type": "object",
        "required": [
          "model_id",
          "state"
        ],
        "title": "LifecycleResponse"
      },
      "LoraSelection": {
        "properties": {
          "lora_id": {
            "type": "string",
            "maxLength": 128,
            "minLength": 1,
            "title": "Lora Id"
          },
          "scale": {
            "type": "number",
            "maximum": 2.0,
            "minimum": 0.0,
            "title": "Scale",
            "default": 1.0
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "lora_id"
        ],
        "title": "LoraSelection"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      },
      "ErrorResponse": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "securitySchemes": {
      "InferenceBearer": {
        "type": "http",
        "scheme": "bearer"
      },
      "AdminBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    }
  }
