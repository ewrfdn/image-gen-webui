[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gen-inference"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "pillow==11.1.0",
  "psutil==6.1.1",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5,<2.8",
  "diffusers>=0.33,<0.36",
  "transformers>=4.46,<4.53",
  "accelerate>=1.2,<2",
  "peft>=0.14,<0.17",
  "safetensors>=0.5,<0.7",
]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
