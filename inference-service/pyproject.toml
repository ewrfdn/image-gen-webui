[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gen-inference"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.6; python_version < '3.14'",
  "fastapi==0.142.2; python_version >= '3.14'",
  "uvicorn==0.34.0; python_version < '3.14'",
  "uvicorn==0.54.0; python_version >= '3.14'",
  "pydantic==2.10.4; python_version < '3.14'",
  "pydantic==2.13.5; python_version >= '3.14'",
  "pillow==11.1.0; python_version < '3.14'",
  "pillow==12.3.0; python_version >= '3.14'",
  "psutil==6.1.1; python_version < '3.14'",
  "psutil==7.2.2; python_version >= '3.14'",
]

[project.optional-dependencies]
gpu = [
  # cu130 wheels only; the vendor GB10 build of Torch is installed separately in the image.
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
  # MiniMax-H3-Image merged into Diffusers on 2026-11-10 (no PyPI release yet).
  "diffusers @ git+https://github.com/huggingface/diffusers.git@875373ac7f5856071e345a3e394c74efccc6b9e6",
  "transformers==5.22.2",
  "accelerate==1.15.0",
  "peft==0.21.2",
  "torchao==0.18.0",
  "safetensors==0.8.0",
]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["inference_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
